rationale:
  identifier_component: >-
    The first confirmatory benchmark uses synthetic identifier namespaces and
    does not claim ISO OID assigning-authority semantics for every identifier.
    Selecting the NG component avoids manufacturing global-identity semantics
    that are not present in the source facts.
  gu_counterargument: >-
    GU would exercise namespace and assigning-authority fidelity more strongly,
    but doing so in a synthetic benchmark would require authoring global OID
    identity semantics that the source facts do not independently possess.
    That would contaminate the fabrication construct the study is designed to
    measure. A later extension may add a separately authored GU slice.
  filler_order_component: >-
    The benchmark can author one explicit source-grounded filler order
    identifier that is unique per laboratory order. FRU therefore avoids the
    additional composite identity semantics of FRN, where filler order number
    and universal service identifier jointly identify the order.
  scientific_scope: >-
    This is a bounded study-design choice for the initial general laboratory
    slice, not a claim that NG/FRU is preferable for production interfaces.


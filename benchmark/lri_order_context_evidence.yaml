    - LRI_GU_FRN_Profile_V3
    - LRI_NG_FRU_Profile_V3
    - LRI_NG_FRN_Profile_V3
  selected_confirmatory_combination: LRI_NG_FRU_Profile_V3_candidate_pending_machine_bundle
  selection_record: benchmark/lri_profile_selection.yaml
  note: >-
    LRI_NG_FRU_Profile_V3 is the selected study-design candidate. The exact
    machine-readable bundle remains required before profile identity is frozen.


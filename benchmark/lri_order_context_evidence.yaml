edition5_profile_architecture:
  minimum_required_profile_components:
    - LRI_Common_Component_V3
    - one_of_LRI_GU_Component_R1_or_LRI_NG_Component_R1
    - one_of_LAB_FRU_Component_or_LAB_FRN_Component
  pre_coordinated_general_profiles:
    - LRI_GU_FRU_Profile_V3
    - LRI_GU_FRN_Profile_V3
    - LRI_NG_FRU_Profile_V3
    - LRI_NG_FRN_Profile_V3
  selected_confirmatory_combination: unresolved_pending_profile_choice
  note: >-
    General-laboratory scope does not remove the base ORC/OBR requirements.
    A specific GU/NG and FRU/FRN combination must still be frozen before
    confirmatory profile validation.

legacy_nist_comparator:
  repository: usnistgov/hit-core-hl7v2
  repository_commit: 3ee9df7d3345944f4a70cccf9be504e499a24c1b
  profile_path: hit-core-hl7v2-service/src/test/resources/profiles/1_1_2_Profile.xml
  constraints_path: hit-core-hl7v2-service/src/test/resources/constraints/1_1_2_Constraints.xml
  profile_generation: LRI_R2_2016
  role: historical_differential_only
  warning: >-
    This is not Edition 5 and must never be substituted for the exact
    Edition 5 + 2024DEC profile used for confirmatory scoring.

secondary_implementation_evidence:
  source: Michigan_DHHS_Bureau_of_Laboratories
  document: HL7_V2_5_1_Implementation_Guide_Lab_Results
  source_url: https://www.michigan.gov/mdhhs/-/media/Project/Websites/mdhhs/Folder1/Folder9/StarLIMS_Result_IG.pdf
  relationship_to_standard: local_implementation_adapted_from_lri_edition5
  role: corroborating_secondary_only
  warning: >-
    Local implementation guides may add, remove, or strengthen constraints and
    therefore cannot define the FHIRBridge confirmatory target.

freeze_decision:
  exact_edition5_profile_bundle_required_for_machine_validation: true
  resolved_from_authoritative_publication:
    ORC_usage: R
    ORC_cardinality: "1..1"
    OBR_usage: R
    OBR_cardinality: "1..1"
    placer_order_identifier_usage: RE
    placer_order_identifier_cardinality: "0..1"
    filler_order_identifier_usage: R
    filler_order_identifier_cardinality: "1..1"
    ordering_provider_usage: R
    ordering_provider_cardinality: "1..1"
  still_required_before_hl7_profile_qualification:
    - select_exact_general_lri_profile_component_combination
    - acquire_exact_machine_readable_profile_bundle
    - verify_profile_bundle_lineage_to_edition5_2024dec
    - qualify_reference_and_negative_messages_against_profile
  prohibited_shortcuts:
    - infer_machine_profile_from_human_readable_pdf
    - infer_edition5_from_legacy_r2
    - infer_edition5_from_michigan_local_profile
    - invent_order_identifiers_to_make_validator_green
    - map_diagnostic_report_identifier_to_order_identifier_without_review
  required_design_change: >-
    The current ORU renderer cannot be structurally conformant to Edition 5
    while omitting ORC. Add explicit source-grounded order context before
    profile qualification. At minimum, the benchmark source must provide a
    filler order identifier and ordering provider that can be projected to the
    required ORC/OBR fields without inventing facts.
  safe_source_grounded_path: >-
    Add an explicit canonical order fact plus corresponding FHIR
    ServiceRequest/requester context and HL7 v2 ORC/OBR projection. Keep new
    order-identifier semantic scoring outside the primary endpoint until the
    mapping is independently reviewed and frozen.

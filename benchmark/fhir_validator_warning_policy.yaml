policy:
  id: FHIRBRIDGE-FHIR-WARNINGS-001
  version: 0.1.0
  status: frozen
  scope: FHIR_R4_US_CORE_9_0_0_structural_qualification
  purpose: >-
    Fail closed on previously unseen FHIR validator warnings while retaining
    explicitly reviewed non-blocking warning classes. A warning class is not
    equivalent to semantic correctness and cannot override verifier findings.

categories:
  - category_id: DOMAIN_RESOURCE_NARRATIVE_BEST_PRACTICE
    regex: "Constraint failed: dom-6:"
    disposition: accepted_nonblocking
    rationale: >-
      Narrative text is a base-FHIR best-practice recommendation. The benchmark
      evaluates structured laboratory facts and does not use generated narrative
      as semantic ground truth.

  - category_id: OBSERVATION_PERFORMER_BEST_PRACTICE
    regex: "all observations should have a performer"
    disposition: accepted_nonblocking
    rationale: >-
      US Core recommends performer information, but performer is outside the
      first frozen laboratory semantic slice pending projectability review.

  - category_id: OFFLINE_UCUM_TERMINOLOGY_CHECK
    regex: "Unable to validate code '.+' in system 'http://unitsofmeasure.org' because the validator is running without terminology services"
    disposition: accepted_separate_oracle
    rationale: >-
      Confirmatory structural validation intentionally disables live terminology.
      UCUM quantity equivalence is handled by the separately pinned and qualified
      local UCUM provider.

  - category_id: SYNTHETIC_CODE_SYSTEM_UNAVAILABLE
    regex: "A definition for CodeSystem 'urn:fhirbridge:synthetic:"
    disposition: accepted_synthetic_variant
    rationale: >-
      Held-out/local-code benchmark variants deliberately exercise code systems
      not published to external terminology services.

  - category_id: LOCAL_LAB_CODE_EXTENSIBLE_VALUESET
    regex: "None of the codings provided are in the value set 'US Core Laboratory Test Codes'"
    disposition: accepted_synthetic_variant
    rationale: >-
      US Core laboratory code binding is extensible. This warning is expected
      only in the explicit local-code scenario and is retained as evidence.

  - category_id: CODED_RESULT_SNOMED_BEST_PRACTICE
    regex: "us-core-4: 'SHOULD use SNOMED CT for coded Results'"
    disposition: accepted_synthetic_variant
    rationale: >-
      The coded-result scenario intentionally uses a synthetic local result code
      to test mapping-aware behavior. The SHOULD-level warning remains visible.

freeze_rules:
  unknown_warning_count_must_equal: 0
  accepted_categories_must_be_versioned: true
  warning_text_must_be_archived: true
  no_warning_may_be_promoted_to_semantic_equivalence: true

freeze_evidence:
  frozen_scope: pinned_offline_FHIR_CLI_log_classification
  validator_version: "6.10.0"
  validator_artifact_sha256: fc663ae55dd31bbfde19788dddfb49cacbeebc3c64498fa7b7779df90000434b
  fhir_version: "4.0.1"
  implementation_guide: hl7.fhir.us.core#9.0.0
  terminology_server_mode: disabled_tx_n_a
  combined_warning_audit:
    github_actions_run_id: 38072689400
    github_actions_job_id: 114273236072
    result: success
    baseline_and_order_context_directories_audited: true
    primary_order_context_fixture_count: 11
    unknown_warning_count_required_by_CI: 0
    total_error_count_required_by_CI: 0
  terminology_scope_justification: >-
    Live terminology is intentionally disabled in the structural validator.
    UCUM, LOINC, and THO-sensitive terminology requirements are handled by
    separately pinned qualification paths; accepted offline-terminology
    warnings cannot establish semantic equivalence.
  classifier: src/fhirbridge/structural_validity_policy.py::classify_fhir_validator_log
  unknown_warning_behavior: POLICY_UNRESOLVED
  validator_execution_failure_behavior: MEASUREMENT_FAILURE

manifest:
  schema_version: 0.1.0
  status: candidate
  purpose: >-
    Candidate dependency pins for FHIRBridge-Bench Protocol v1.0. These values
    are not frozen until the protocol freeze gate is satisfied and artifact
    hashes / exact local implementations are recorded.

terminology:
  loinc:
    content_version: "2.83"
    release_date: "2026-08-19"
    confirmatory_mode: local_snapshot
    live_fhir_service_role: audit_only
    live_fhir_service_maturity: beta
    local_snapshot_sha256: unresolved
    local_provider_implementation: unresolved
    local_provider_version: unresolved
    local_provider_qualification_passed: false
    license_review: required_before_public_release

  hl7_terminology:
    package: hl7.terminology
    version: "7.4.0"
    r4_package: hl7.terminology.r4
    status_date: "2026-09-22"
    package_sha256: unresolved

units:
  ucum:
    content_version: "2.2"
    essence_revision_date: "2024-06-17"
    essence_sha256: unresolved
    implementation: org.fhir:ucum
    implementation_version: "1.0.10"
    implementation_role: candidate_local_provider
    implementation_license: BSD-3-Clause
    functional_tests_source: https://ucum.org/docs/functional-tests
    official_functional_tests_passed: false
    project_lab_conversion_matrix_passed: false

structural_validation:
  fhir:
    validator_wrapper: org.hl7.fhir.validator-wrapper
    validator_wrapper_version: "1.0.82"
    validator_wrapper_commit: fe316e7
    core_version: "6.10.0"
    validator_artifact_sha256: unresolved
    runtime: unresolved
    packages:
      fhir_r4: unresolved
      us_core: unresolved
      hl7_terminology_r4: "7.4.0"
    profile_validation_qualification_passed: false
    network_during_confirmatory_scoring: disabled_where_practical

  hl7v2:
    target: HL7_v2.5.1_LRI_Ed5_ORU_R01
    errata: 2024DEC
    validator: gov.cdc:lib-hl7v2-nist-validator
    validator_version: "1.5.0"
    validator_license: Apache-2.0
    nist_engine_version: "1.7.3"
    runtime: Java_17
    profile_source: IGAMT-2_exported_XML_resource_bundle
    profile_artifact: unresolved
    profile_artifact_sha256: unresolved
    support_level: candidate_profile_level_offline
    profile_validation_qualification_passed: false
    hosted_gvt_role: audit_only
    network_during_confirmatory_scoring: disabled
    source_repository: https://github.com/CDCgov/lib-hl7v2-nist-validator

semantic_policy:
  code_equivalence:
    exact_code_system_pair: allowed
    frozen_approved_mapping: allowed
    reviewed_contract_equivalence: allowed
    display_string_only: forbidden
    lexical_similarity_only: forbidden
    embedding_similarity_only: forbidden
    hierarchy_proximity_only: forbidden
    unversioned_live_translate_only: forbidden

  unit_equivalence:
    exact_unit_with_value_tolerance: allowed
    ucum_conversion: candidate_until_provider_qualified
    joint_value_unit_equivalence_required: true

network_policy:
  confirmatory_primary_oracle: local_pinned_dependencies
  live_terminology_services: audit_only
  hosted_hl7v2_validation_services: audit_only
  silent_network_fallback: forbidden

freeze_gate:
  unresolved_token: unresolved
  required_before_status_frozen:
    - terminology.loinc.local_snapshot_sha256
    - terminology.loinc.local_provider_implementation
    - terminology.loinc.local_provider_version
    - terminology.hl7_terminology.package_sha256
    - units.ucum.essence_sha256
    - units.ucum.implementation
    - units.ucum.implementation_version
    - structural_validation.fhir.validator_artifact_sha256
    - structural_validation.fhir.runtime
    - structural_validation.fhir.packages.fhir_r4
    - structural_validation.fhir.packages.us_core
    - structural_validation.hl7v2.validator
    - structural_validation.hl7v2.validator_version
    - structural_validation.hl7v2.profile_artifact
    - structural_validation.hl7v2.profile_artifact_sha256
    - structural_validation.hl7v2.support_level
  required_boolean_true_before_status_frozen:
    - terminology.loinc.local_provider_qualification_passed
    - units.ucum.official_functional_tests_passed
    - units.ucum.project_lab_conversion_matrix_passed
    - structural_validation.fhir.profile_validation_qualification_passed
    - structural_validation.hl7v2.profile_validation_qualification_passed

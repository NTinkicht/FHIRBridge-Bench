grounding_guards:
  - guard_id: ORDER_IDENTIFIER_SOURCE_GROUNDING_001
    source_fact_type: order
    additional_source_fact_types: [diagnostic_report]
    additional_source_relation_type: has_report
    source_field: identifiers.value
    target_fact_type: order
    target_field: identifiers.value
    match_type: exact_scalar_membership
    primary_endpoint_eligible: true
    rationale: >-
      Any placer/filler identifier asserted in a grounded target order fact
      must occur in an authored canonical order OR diagnostic_report identifier.
      This avoids calling an authored accession fabricated when it appears in
      a filler slot. It does not license the particular placer/filler assignment;
      those mappings remain INDETERMINATE pending blind expert contract review.
      Patient and specimen identifiers and unrelated reports are deliberately
      not admissible here; the accession must belong to the matched source
      order's has_report relationship.
    evidence:
      - benchmark/lri_order_context_evidence.yaml
      - benchmark/lri_profile_selection.yaml
    status: draft

  - guard_id: ORDER_REQUESTER_IDENTIFIER_SOURCE_GROUNDING_001
    source_fact_type: order
    source_field: attributes.requester.identifiers.value
    target_fact_type: order
    target_field: attributes.requester.identifiers.value
    match_type: exact_scalar_membership
    primary_endpoint_eligible: true
    rationale: >-
      Any ordering-provider identifier asserted in a grounded target order fact
      must exist in the authored canonical order context. The guard does not
      decide whether a FHIR requester Reference and HL7 v2 XCN are fully
      equivalent, nor which XCN components must be scored.
    evidence:
      - benchmark/lri_order_context_evidence.yaml
    status: draft

indeterminate_candidates:
  - candidate_id: REPORT_IDENTIFIER_MAPPING
    reason: >-
      DiagnosticReport identifiers and v2 placer/filler/order identifiers can
      represent different business identifiers. Exact permitted loci require
      profile-level review before a preservation rule is frozen.

  - candidate_id: ENCOUNTER_CONTEXT_MAPPING
    reason: >-
      Encounter information may not be uniformly required for all laboratory
      result scenarios and must be scoped by profile/use case.

  - candidate_id: PERFORMER_INTERPRETER_MAPPING
    reason: >-
      FHIR performer/resultsInterpreter references can target multiple actor
      types; exact v2 representation must be reviewed against the LRI profile.

  - candidate_id: PANEL_COMPONENT_TOPOLOGY
    reason: >-
      FHIR Observation components and panel/member relationships do not imply a
      unique OBX serialization. Equivalence-class rules are required before
      confirmatory scoring.

  - candidate_id: FREE_TEXT_REPORT_REPRESENTATION
    reason: >-
      DiagnosticReport.presentedForm/conclusion and narrative results are
      deferred from the atomic-result confirmatory core.

validation_requirements:
  - independent_lri_field_review
  - external_expert_contract_review
  - external_contract_agreement_study
  - clean_room_renderer_review
  - lifting_parser_validation
  - order_grounding_guard_validation
  - terminology_service_validation
  - ucum_equivalence_tests
  - seeded_fault_qualification
  - blinded_expert_gold_validation
  - contract_sensitivity_analysis

notes:
  - >-
      This contract is a study instrument, not an HL7 implementation guide and
      not a production interface specification.
  - >-
      Reverse rules are not inferred merely because a forward v2-to-FHIR map
      exists; each remains subject to target-profile review.
  - >-
      Draft mappings marked expert_review_required must not be treated as
      frozen truth in confirmatory experiments.
  - >-
      Any ambiguity discovered before freeze is moved to INDETERMINATE rather
      than resolved by observing which output a model or converter produces.

  - >-
      Contract v0.3 introduces order-context candidates and a narrow
      representation-independent grounding invariant. The new order mapping
      rules remain INDETERMINATE and outside the primary equivalence endpoint
      until blind external review and machine-profile qualification.

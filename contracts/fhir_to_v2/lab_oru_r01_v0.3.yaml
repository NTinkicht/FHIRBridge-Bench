    canonical_fact: patient.identifier
    projectability: MUST_PRESERVE
    source_paths: [Patient.identifier]
    target_paths: [PID-3]
    allowed_operations: [COPY, NORMALIZE]
    equivalence:
      type: identifier
      preserve_value: true
      namespace_change_requires_declared_rule: true
    failure_types: [OMISSION, CORRUPTION, MISATTRIBUTION]
    severity_default: S3
    evidence:
      - https://hl7.org/fhir/uv/v2mappings/ConceptMap-segment-pid-to-patient.html
    expert_review_required: true
    status: draft

  - rule_id: PATIENT_NAME_001

  version: 2.5.1
  implementation_guide: Laboratory_Results_Interface
  implementation_guide_edition: 5
  errata: 2024DEC
  message: ORU^R01
  realm: US
  selected_profile_candidate: LRI_NG_FRU_Profile_V3
  profile_selection_record: benchmark/lri_profile_selection.yaml
  exact_machine_profile_status: pending_acquisition_and_qualification

scope:
  included:
    - general_laboratory_reporting
    - chemistry_style_results
    - hematology_style_results
    - atomic_results
    - simple_panels
  deferred:
    - microbiology_susceptibility
    - clinical_genomics
    - newborn_dried_bloodspot_screening
    - public_health_specific_extensions
    - unreviewed_local_fhir_extensions
    - unrestricted_free_text_reports

projectability_classes:
  - MUST_PRESERVE
  - MAY_TRANSFORM
  - MAY_LOSE
  - MUST_NOT_INFER
  - INDETERMINATE

allowed_operations:
  - COPY
  - NORMALIZE
  - CODE_TRANSLATE
  - UNIT_CONVERT
  - AGGREGATE
  - DECOMPOSE
  - DERIVE_DECLARED
  - DROP_DECLARED

precedence:
  description: >-
    Error classification is resolved at canonical-fact level. A grounded fact
    attached to the wrong patient/report/observation is MISATTRIBUTION rather
    than a double-counted OMISSION plus FABRICATION pair.
  order:
    - MISATTRIBUTION
    - CORRUPTION
    - OMISSION
    - FABRICATION


name: Renderer B clean-room contract preflight

on:
  pull_request:
    branches:
      - renderer-b-cleanroom
  push:
    branches:
      - renderer-b-cleanroom

permissions:
  contents: read

jobs:
  isolate-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema validation tools
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "jsonschema>=4.20,<5"
      - name: Check contract byte pin, schema and forbidden source paths
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import yaml
          from jsonschema import Draft202012Validator

          contract = Path("contracts/fhir_to_v2/lab_oru_r01_v0.3.yaml")
          expected = "7058513c8541e175d2368a6698f285a594f13cde58cd0f4b6455c7cac95b4ac5"
          assert contract.is_file(), "Draft contract missing"
          actual = sha256(contract.read_bytes()).hexdigest()
          assert actual == expected, f"Contract byte mismatch: {actual}"

          schema_path = Path("contracts/schema/projectability_contract.schema.yaml")
          assert schema_path.is_file(), "Contract JSON Schema missing"
          schema = yaml.safe_load(schema_path.read_text(encoding="utf-8"))
          document = yaml.safe_load(contract.read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          errors = list(validator.iter_errors(document))
          assert not errors, "Draft contract fails its checked-in schema: " + "; ".join(
              str(error.message) for error in errors[:5]
          )

          declaration_schema = json.loads(
              Path("renderer_validation/schema/renderer_implementation_declaration.schema.json").read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(declaration_schema)
          declaration = yaml.safe_load(
              Path("renderer_validation/examples/renderer_b_declaration_template.yaml").read_text(encoding="utf-8")
          )
          declaration_errors = list(Draft202012Validator(declaration_schema).iter_errors(declaration))
          assert not declaration_errors, "Agent declaration template is schema-invalid: " + "; ".join(
              str(error.message) for error in declaration_errors[:5]
          )
          assert declaration["independence"]["llm_generated_mapping_code_used"] is True, "Codex authorship must be disclosed"
          assert declaration["clean_room_inputs"]["challenge_version"] == "0.3.0"

          handoff_schema = json.loads(
              Path("renderer_validation/schema/renderer_b_expected_inputs.schema.json").read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(handoff_schema)
          packet = Path("docs/renderer_b_assignment_packet.md").read_text(encoding="utf-8")
          assert "llm_generated_mapping_code_used: true" in packet, "Codex agent packet missing AI authorship requirement"

          prohibited = (
              "src/fhirbridge/renderers/fhir_r4_a.py",
              "src/fhirbridge/renderers/hl7v251_oru_a.py",
              "src/fhirbridge/renderer_b_challenge.py",
              "src/fhirbridge/semantic_verifier.py",
              "src/fhirbridge/semantic_lifter.py",
              "qualification/faults",
              "qualification/hl7v2/results",
          )
          present = [p for p in prohibited if Path(p).exists()]
          assert not present, f"Clean-room exposure risk: {present}"
          print("PASS: pinned draft contract matches, schema validates and prohibited implementation paths are absent")
          PY

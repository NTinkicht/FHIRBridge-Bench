name: Protocol validation

on:
  pull_request:
  push:
    branches:
      - main
      - protocol-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research tooling
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test schemas and protocol artifacts
        run: pytest -q

      - name: Validate canonical development example explicitly
        run: >-
          fhirbridge-validate
          canonical/examples/LAB-001-example.yaml
          canonical/schema/clinical_fact_graph.schema.yaml
          --schema-dir canonical/schema


      - name: Build deterministic seeded-fault development batch
        run: python qualification/faults/build_development_batch.py

      - name: Archive seeded-fault development batch
        uses: actions/upload-artifact@v4
        with:
          name: development-fault-batch-${{ github.run_id }}
          path: qualification/faults/results/development-fault-batch.json
          if-no-files-found: error
          retention-days: 90


  ucum-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FHIRBridge-Bench
        uses: actions/checkout@v4

      - name: Checkout pinned Ucum-java
        uses: actions/checkout@v4
        with:
          repository: FHIR/Ucum-java
          ref: db9d22ade3f0f4a667b45817b85a9ac4534e4224
          path: vendor/Ucum-java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            vendor/Ucum-java/pom.xml
            qualification/ucum/pom.xml

      - name: Verify pinned UCUM artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/Ucum-java rev-parse HEAD)" = "db9d22ade3f0f4a667b45817b85a9ac4534e4224"
          echo "dfccea1b5dc284245ebae97edd1dc03c45864da4e87df55bc9851797b4fd0b61  vendor/Ucum-java/src/main/resources/ucum-essence.xml" | sha256sum -c -
          echo "3b3feb9d8ecfe8958da69b1afcd25572e3f8d80a36bfcbcda4834a10a0eeef0d  vendor/Ucum-java/src/test/resources/UcumFunctionalTests.xml" | sha256sum -c -

      - name: Run official UCUM functional tests
        working-directory: vendor/Ucum-java
        run: mvn -B -Dtest=UcumFunctionalTests test

      - name: Run FHIRBridge laboratory UCUM matrix
        working-directory: qualification/ucum
        run: >
          mvn -B test
          -DucumMatrix="${{ github.workspace }}/benchmark/ucum_lab_conversion_matrix.yaml"
          -DucumEssence="${{ github.workspace }}/vendor/Ucum-java/src/main/resources/ucum-essence.xml"

      - name: Archive UCUM qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucum-qualification-evidence-${{ github.run_id }}
          path: |
            vendor/Ucum-java/target/surefire-reports/**
            qualification/ucum/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 90


  fhir-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FHIRBridge-Bench
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FHIRBridge-Bench
        run: python -m pip install -e .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Render deterministic FHIR qualification fixtures
        run: python qualification/fhir/render_fixtures.py

      - name: Download and verify pinned FHIR validator CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o qualification/fhir/validator_cli.jar             https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.10.0/validator_cli.jar
          echo "fc663ae55dd31bbfde19788dddfb49cacbeebc3c64498fa7b7779df90000434b  qualification/fhir/validator_cli.jar" | sha256sum -c -

      - name: Validate FHIR development fixtures against US Core 9.0.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/fhir/results
          for fixture in qualification/fhir/out/LAB-*.json; do
            name="$(basename "${fixture}" .json)"
            log="qualification/fhir/results/${name}.log"
            if ! java -jar qualification/fhir/validator_cli.jar               "${fixture}"               -version 4.0.1               -ig hl7.fhir.us.core#9.0.0               -tx n/a               > "${log}" 2>&1; then
              echo "::group::FHIR validator output for ${name}"
              cat "${log}"
              echo "::endgroup::"
              exit 1
            fi
          done

      - name: Summarize FHIR qualification outcomes
        run: python qualification/fhir/summarize_validation.py qualification/fhir/results

      - name: Freeze resolved FHIR package cache manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/fhir/results
          if [ -d "$HOME/.fhir/packages" ]; then
            (
              cd "$HOME/.fhir/packages"
              find . -type f -print0                 | sort -z                 | xargs -0 sha256sum
            ) > qualification/fhir/results/package-cache.sha256
            sha256sum qualification/fhir/results/package-cache.sha256               > qualification/fhir/results/package-cache-manifest.digest
            (
              cd "$HOME/.fhir/packages"
              find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            ) > qualification/fhir/results/package-directories.txt
          fi

      - name: Archive FHIR qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-qualification-evidence-${{ github.run_id }}
          path: |
            qualification/fhir/out/**
            qualification/fhir/results/**
          if-no-files-found: warn
          retention-days: 90


  hl7v2-harness-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FHIRBridge-Bench
        uses: actions/checkout@v4

      - name: Checkout pinned CDC NIST validator bundle
        uses: actions/checkout@v4
        with:
          repository: CDCgov/lib-hl7v2-nist-validator
          ref: eeac90c5f88dca3018992005232acdf3da644d88
          path: vendor/lib-hl7v2-nist-validator

      - name: Checkout pinned historical NIST LRI comparator
        uses: actions/checkout@v4
        with:
          repository: usnistgov/hit-core-hl7v2
          ref: 3ee9df7d3345944f4a70cccf9be504e499a24c1b
          path: vendor/nist-legacy-lri

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FHIRBridge-Bench for development fixture rendering
        run: python -m pip install -e .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: qualification/hl7v2/pom.xml

      - name: Verify pinned CDC validator bundle revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/lib-hl7v2-nist-validator rev-parse HEAD)" = "eeac90c5f88dca3018992005232acdf3da644d88"
          test -f vendor/lib-hl7v2-nist-validator/lib/gov/nist/hl7-v2-parser/1.7.3/hl7-v2-parser-1.7.3.jar
          test -f vendor/lib-hl7v2-nist-validator/lib/gov/nist/hl7-v2-profile/1.7.3/hl7-v2-profile-1.7.3.jar
          test -f vendor/lib-hl7v2-nist-validator/lib/gov/nist/hl7-v2-validation/1.7.3/hl7-v2-validation-1.7.3.jar

      - name: Compile pinned NIST HL7 v2 qualification harness
        run: mvn -B -f qualification/hl7v2/pom.xml package -DskipTests

      - name: Prepare pinned historical LRI differential bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/hl7v2/dev-profile
          cp vendor/nist-legacy-lri/hit-core-hl7v2-service/src/test/resources/profiles/1_1_2_Profile.xml             qualification/hl7v2/dev-profile/PROFILE.xml
          cp vendor/nist-legacy-lri/hit-core-hl7v2-service/src/test/resources/constraints/1_1_2_Constraints.xml             qualification/hl7v2/dev-profile/CONSTRAINTS.xml
          cp vendor/nist-legacy-lri/hit-core-hl7v2-service/src/test/resources/tables/new_ValueSetLibrary.xml             qualification/hl7v2/dev-profile/VALUESETS.xml

      - name: Render current development ORU fixture
        run: python qualification/hl7v2/render_fixture.py

      - name: Exercise NIST validator harness against legacy differential profile
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -f qualification/hl7v2/pom.xml exec:java             -Dexec.mainClass=org.fhirbridge.hl7v2.ValidateLriProfile             -Dexec.args="qualification/hl7v2/dev-profile qualification/hl7v2/dev-message.er7 --report-only"             | tee qualification/hl7v2/legacy-differential-report.log
          grep -q '"error_total":' qualification/hl7v2/legacy-differential-report.log
          grep -q '"status":"STRUCTURE_ERRORS"' qualification/hl7v2/legacy-differential-report.log

      - name: Archive legacy differential harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hl7v2-legacy-differential-${{ github.run_id }}
          path: |
            qualification/hl7v2/dev-message.er7
            qualification/hl7v2/legacy-differential-report.log
          if-no-files-found: warn
          retention-days: 90

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://fhirbridge-bench.org/schema/clinical_fact_graph.schema.yaml"
$title: FHIRBridge Canonical Clinical Fact Graph
$type: object
$comment: >-
  Standard-independent graph used as the semantic origin for synthetic benchmark
  scenarios. It must not encode a preferred FHIR or HL7 v2 serialization.
required:
  - graph_id
  - schema_version
  - scenario_type
  - facts
properties:
  graph_id:
    type: string
    minLength: 1
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  scenario_type:
    type: string
    enum:
      - laboratory_result
  patient_ref:
    type: [string, "null"]
  encounter_ref:
    type: [string, "null"]
  facts:
    type: array
    minItems: 1
    items:
      $ref: "clinical_fact.schema.yaml"
  assertions:
    type: array
    description: >-
      Cross-fact invariants authored independently of either serialization.
      These are candidate verifier or metamorphic-test inputs, not renderer rules.
    items:
      type: object
      required:
        - assertion_id
        - assertion_type
        - fact_refs
      properties:
        assertion_id:
          type: string
        assertion_type:
          type: string
          enum:
            - same_subject
            - belongs_to_report
            - belongs_to_order
            - specimen_for_observation
            - result_time_within_report_context
            - identifier_unique_within_namespace
            - value_unit_pair
            - status_consistency
            - custom
        fact_refs:
          type: array
          minItems: 1
          items:
            type: string
        parameters:
          type: object
          additionalProperties: true
      additionalProperties: false
  scenario_metadata:
    type: object
    properties:
      seed:
        type: [integer, "null"]
      generator_version:
        type: [string, "null"]
      clinical_template:
        type: [string, "null"]
      implementation_variant_id:
        type: [string, "null"]
      synthetic_only:
        type: boolean
      partition:
        type: string
        enum:
          - development
          - pilot
          - confirmatory
          - external
      primary_endpoint_eligible:
        type: boolean
      contract_state:
        type: string
        enum:
          - SCORABLE
          - INDETERMINATE
      expected_rule_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      notes:
        type: [string, "null"]
    additionalProperties: false
additionalProperties: false
